services:
  app:
    build:
      context: .
    working_dir: /var/www/html
    command: ["sh", "/var/www/html/docker/app-entrypoint.sh"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/data/database.sqlite
      DB_FOREIGN_KEYS: "true"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - app-data:/var/www/html/storage/app/data
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'"]
      interval: 3s
      timeout: 2s
      retries: 30

  web:
    image: nginx:1.24-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  app-data:
  vendor:
